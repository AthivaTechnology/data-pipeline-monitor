AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Data Pipeline Freshness Monitor - MVP.
  Read-only against Step Functions/S3; writes only to its own DynamoDB table.
  No VPC (avoids NAT Gateway cost), no always-on compute.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage, used for tagging/naming only.
  DashboardCertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:382625484581:certificate/f3eeb996-dd26-4a41-ab38-2224a1e9f6f2"
    Description: >
      ACM cert (us-east-1, required for CloudFront) for datapipeline.athivaone.com.
      Issued and DNS-validated once, manually, against the existing athivaone.com
      Route53 zone - not something this stack creates itself each deploy.

Globals:
  Function:
    # Matches the Python 3.11 interpreter available locally for `sam build`
    # (no Docker required); also a runtime already in wide use in this account.
    Runtime: python3.11
    Timeout: 60
    MemorySize: 256
    Tags:
      project: pipeline-freshness-monitor
      stage: !Ref Stage

Resources:
  PipelineStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pipeline-freshness-status
      BillingMode: PAY_PER_REQUEST # on-demand: no idle capacity cost at MVP scale
      AttributeDefinitions:
        - AttributeName: pipeline_name
          AttributeType: S
      KeySchema:
        - AttributeName: pipeline_name
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  MonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pipeline-freshness-monitor
      CodeUri: ./
      Handler: src.handler.lambda_handler
      Description: Collects Step Functions/S3 state and writes computed freshness status to DynamoDB.
      Environment:
        Variables:
          STATUS_TABLE_NAME: !Ref PipelineStatusTable
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Name: pipeline-freshness-monitor-schedule
            Description: Runs the freshness monitor every 15 minutes.
            Schedule: rate(15 minutes)
            Enabled: true
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadRegisteredStepFunctions
              Effect: Allow
              Action:
                - states:ListExecutions
              Resource:
                # Least privilege: only the state machines currently in
                # config/registry.yaml. Add a new ARN here when a pipeline is
                # registered - this policy is intentionally not wildcarded
                # across all Step Functions in the account.
                - arn:aws:states:us-east-1:382625484581:stateMachine:athena_data_export
                - arn:aws:states:us-east-1:382625484581:stateMachine:syco_unload_and_hourly_refresh
                - arn:aws:states:us-east-1:382625484581:stateMachine:pulse_data_load
                - arn:aws:states:us-east-1:382625484581:stateMachine:audit_load_batch
                - arn:aws:states:us-east-1:382625484581:stateMachine:v2-lhg-dynamodb-export-s3
                - arn:aws:states:us-east-1:382625484581:stateMachine:connect_lake_load_batch
                - arn:aws:states:us-east-1:382625484581:stateMachine:ansible_data_load
                - arn:aws:states:us-east-1:382625484581:stateMachine:twilio_data_extract
                - arn:aws:states:us-east-1:382625484581:stateMachine:ringcentral_transcribe_job
                - arn:aws:states:us-east-1:382625484581:stateMachine:syco_incremental_export
            - Sid: ReadRegisteredStepFunctionExecutions
              Effect: Allow
              Action:
                - states:DescribeExecution
              Resource:
                - arn:aws:states:us-east-1:382625484581:execution:athena_data_export:*
                - arn:aws:states:us-east-1:382625484581:execution:syco_unload_and_hourly_refresh:*
                - arn:aws:states:us-east-1:382625484581:execution:pulse_data_load:*
                - arn:aws:states:us-east-1:382625484581:execution:audit_load_batch:*
                - arn:aws:states:us-east-1:382625484581:execution:v2-lhg-dynamodb-export-s3:*
                - arn:aws:states:us-east-1:382625484581:execution:connect_lake_load_batch:*
                - arn:aws:states:us-east-1:382625484581:execution:ansible_data_load:*
                - arn:aws:states:us-east-1:382625484581:execution:twilio_data_extract:*
                - arn:aws:states:us-east-1:382625484581:execution:ringcentral_transcribe_job:*
                - arn:aws:states:us-east-1:382625484581:execution:syco_incremental_export:*
            - Sid: ReadRegisteredOutputObjects
              Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                # Least privilege: exact registered output key(s) only, not the bucket.
                - arn:aws:s3:::athiva-leadgen-bucket/vip_queue/Customer_details.csv
            - Sid: WriteOwnStatusTable
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt PipelineStatusTable.Arn
            # ---- Account-wide discovery (read-only) ----
            # Unlike the statements above, these cannot be scoped to specific
            # ARNs: discovery's entire purpose is to find state machines that
            # are NOT in config/registry.yaml, so their ARNs are unknown at
            # policy-authoring time. Every action here is a List/Describe/Get
            # read - nothing here can create, modify, start, stop, or delete
            # anything.
            - Sid: DiscoverAndReadUnregisteredStepFunctions
              Effect: Allow
              Action:
                - states:ListStateMachines
                - states:DescribeStateMachine
                - states:ListExecutions
                - states:DescribeExecution
              Resource: "*"
            - Sid: DiscoverTriggersForUnregisteredStepFunctions
              Effect: Allow
              Action:
                - events:ListRuleNamesByTarget
                - events:DescribeRule
                - scheduler:ListSchedules
                - scheduler:GetSchedule
              Resource: "*"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pipeline-freshness-api
      CodeUri: ./
      Handler: src.api_handler.lambda_handler
      Description: Read-only HTTP API serving computed freshness status for the dashboard.
      Environment:
        Variables:
          STATUS_TABLE_NAME: !Ref PipelineStatusTable
      Events:
        GetStatusList:
          Type: HttpApi
          Properties:
            Path: /status
            Method: GET
        GetStatusDetail:
          Type: HttpApi
          Properties:
            Path: /status/{name}
            Method: GET
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadOwnStatusTable
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource: !GetAtt PipelineStatusTable.Arn

  # ---- Dashboard hosting: S3 (private) + CloudFront (public, HTTPS, custom domain) ----
  # The dashboard is plain static HTML/JS/CSS, hash-routed (#/pipeline-monitor/...) -
  # every real HTTP request is for an actual file (/, /app.js, /views/x.js, ...),
  # so no SPA-fallback/rewrite rule is needed here, unlike a path-based router.

  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: pipeline-freshness-monitor-dashboard
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pipeline-freshness-monitor-dashboard-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution.Id}"

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: pipeline-freshness-monitor dashboard
        DefaultRootObject: index.html
        Aliases:
          - datapipeline.athivaone.com
        ViewerCertificate:
          AcmCertificateArn: !Ref DashboardCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: DashboardS3Origin
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: DashboardS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # AWS managed "CachingOptimized" policy - no custom cache config needed.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  DashboardDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z0188898X51DLEN9N60F # existing athivaone.com zone
      Name: datapipeline.athivaone.com
      Type: A
      AliasTarget:
        DNSName: !GetAtt DashboardDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed global hosted zone ID (same for every distribution)
        EvaluateTargetHealth: false

Outputs:
  StatusTableName:
    Value: !Ref PipelineStatusTable
  DashboardApiUrl:
    Description: Base URL for the read-only status API (append /status)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  MonitorFunctionName:
    Value: !Ref MonitorFunction
  DashboardBucketName:
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Value: !Ref DashboardDistribution
  DashboardUrl:
    Value: "https://datapipeline.athivaone.com"
