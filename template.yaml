AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Data Pipeline Freshness Monitor - MVP.
  Read-only against Step Functions/S3; writes only to its own DynamoDB table.
  No VPC (avoids NAT Gateway cost), no always-on compute.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage, used for tagging/naming only.
  DashboardCertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:382625484581:certificate/f3eeb996-dd26-4a41-ab38-2224a1e9f6f2"
    Description: >
      ACM cert (us-east-1, required for CloudFront) for datapipeline.athivaone.com.
      Issued and DNS-validated once, manually, against the existing athivaone.com
      Route53 zone - not something this stack creates itself each deploy.

Globals:
  Function:
    # Matches the Python 3.11 interpreter available locally for `sam build`
    # (no Docker required); also a runtime already in wide use in this account.
    Runtime: python3.11
    Timeout: 60
    MemorySize: 256
    Tags:
      project: pipeline-freshness-monitor
      stage: !Ref Stage

Resources:
  PipelineStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pipeline-freshness-status
      BillingMode: PAY_PER_REQUEST # on-demand: no idle capacity cost at MVP scale
      AttributeDefinitions:
        - AttributeName: pipeline_name
          AttributeType: S
      KeySchema:
        - AttributeName: pipeline_name
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  MonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pipeline-freshness-monitor
      CodeUri: ./
      Handler: src.handler.lambda_handler
      Description: >
        Collects Step Functions state and writes freshness status to DynamoDB
        (every 15 min). Also runs AWS resource lineage discovery and
        application dependency discovery (config/applications.yaml) once a
        day each, mode-dispatched - see src/handler.py.
      Environment:
        Variables:
          STATUS_TABLE_NAME: !Ref PipelineStatusTable
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Name: pipeline-freshness-monitor-schedule
            Description: Runs the freshness monitor every 15 minutes.
            Schedule: rate(15 minutes)
            Enabled: true
        LineageSchedule:
          Type: Schedule
          Properties:
            Name: pipeline-lineage-discovery-schedule
            # A pipeline's structure (which resources it calls) changes far
            # less often than its execution status - recomputing it every
            # 15 minutes alongside freshness would be pure waste. Once a day
            # is enough to pick up new/changed pipelines promptly. The Input
            # is what handler.py's mode-dispatch branch checks for - this
            # schedule is the only thing that ever sends it.
            Description: Runs AWS resource lineage discovery once a day.
            Schedule: rate(1 day)
            Enabled: true
            Input: '{"mode": "lineage"}'
        ApplicationSchedule:
          Type: Schedule
          Properties:
            Name: application-dependency-discovery-schedule
            # Same rate(1 day) cadence as LineageSchedule; not required to be
            # offset for correctness since the two runs write to disjoint
            # DynamoDB key namespaces (APP#/APPRESOURCE# vs LINEAGE#) - if
            # they do land at the same moment, both simply invoke
            # MonitorFunction concurrently, same as any two schedules would.
            Description: >
              Runs Application Dependency discovery for every application in
              config/applications.yaml once a day.
            Schedule: rate(1 day)
            Enabled: true
            Input: '{"mode": "applications"}'
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: WriteOwnStatusTable
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt PipelineStatusTable.Arn
            # ---- Account-wide Step Functions discovery + monitoring (read-only) ----
            # Covers both this function's modes: freshness monitoring and
            # lineage discovery. AWS Step Functions is the single source of
            # truth for which pipelines exist - every state machine in the
            # account is found and processed through this same set of
            # permissions, so this cannot be scoped to specific ARNs the way
            # a registry-driven policy could. Every action here is a
            # List/Describe/Get read - nothing here can create, modify,
            # start, stop, or delete anything. (If config/registry.yaml ever
            # registers a pipeline's `output:` location again, that
            # pipeline's exact S3 object would need its own s3:GetObject
            # grant added here - none is needed while the registry is empty,
            # since evaluate_data_freshness never gets a location to check
            # without one. Lineage discovery needs no Lambda/Firehose/Glue/
            # Athena API permissions either: every resource it detects is
            # classified directly from a state machine's own ASL definition,
            # already readable via DescribeStateMachine below.)
            - Sid: DiscoverAndReadAllStepFunctions
              Effect: Allow
              Action:
                - states:ListStateMachines
                - states:DescribeStateMachine
                - states:ListExecutions
                - states:DescribeExecution
              Resource: "*"
            - Sid: DiscoverTriggersForStepFunctions
              Effect: Allow
              Action:
                - events:ListRuleNamesByTarget
                - events:DescribeRule
                - scheduler:ListSchedules
                - scheduler:GetSchedule
              Resource: "*"
            # ---- Application Dependency (named, already-confirmed applications only, read-only) ----
            # Deliberately scoped to this named list of stacks - never
            # account-wide. See config/applications.yaml and
            # src/application_scanner.py. No lambda:List*/glue:*/states:
            # ListTagsForResource or other enumeration permission is granted:
            # none is needed once scoped to each stack's own resource list
            # (cloudformation:ListStackResources already returns every
            # resource in it).
            - Sid: DescribeApplicationDependencyStacks
              Effect: Allow
              Action:
                - cloudformation:DescribeStacks
                - cloudformation:ListStackResources
              Resource:
                - "arn:aws:cloudformation:us-east-1:382625484581:stack/data-exporter/*"
                - "arn:aws:cloudformation:us-east-1:382625484581:stack/rds-snapshot-exporter/*"
                - "arn:aws:cloudformation:us-east-1:382625484581:stack/tp-apps-data/*"
                - "arn:aws:cloudformation:us-east-1:382625484581:stack/version2-athiva-leadgen-dynamodb-export-s3/*"
                - "arn:aws:cloudformation:us-east-1:382625484581:stack/version3-athiva-leadgen-dynamodb-full-export-s3/*"
                - "arn:aws:cloudformation:us-east-1:382625484581:stack/lhg-dev-stepfunctions-dynamodb-export-s3-multi-eventsrule/*"
            - Sid: DescribeApplicationDependencyEventBridgeTargets
              Effect: Allow
              Action:
                - events:ListTargetsByRule
              # Individual rule names aren't known until ListStackResources
              # runs above, so this can't be pinned to specific rule ARNs -
              # but region+account CAN be fixed regardless of which rule,
              # since every rule this function will ever query belongs to
              # one of the stacks above, in this one account/region. Narrower
              # than a bare "*", unlike this template's older events:*
              # statements (DiscoverTriggersForStepFunctions above), which
              # predate this scoping and are intentionally left as-is here.
              Resource: "arn:aws:events:us-east-1:382625484581:rule/*"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pipeline-freshness-api
      CodeUri: ./
      Handler: src.api_handler.lambda_handler
      Description: Read-only HTTP API serving computed freshness status for the dashboard.
      Environment:
        Variables:
          STATUS_TABLE_NAME: !Ref PipelineStatusTable
      Events:
        GetStatusList:
          Type: HttpApi
          Properties:
            Path: /status
            Method: GET
        GetStatusDetail:
          Type: HttpApi
          Properties:
            Path: /status/{name}
            Method: GET
        GetLineageSummary:
          Type: HttpApi
          Properties:
            Path: /lineage
            Method: GET
        GetLineageDetail:
          Type: HttpApi
          Properties:
            Path: /lineage/{name}
            Method: GET
        GetResourcesList:
          Type: HttpApi
          Properties:
            Path: /resources
            Method: GET
        GetResourceDetail:
          Type: HttpApi
          Properties:
            # Greedy {arn+} on purpose - an ARN can contain literal "/"
            # (e.g. an S3 object ARN), which a plain {arn} path variable
            # would truncate at.
            Path: /resources/{arn+}
            Method: GET
        GetApplicationsList:
          Type: HttpApi
          Properties:
            Path: /applications
            Method: GET
        GetApplicationDetail:
          Type: HttpApi
          Properties:
            Path: /applications/{id}
            Method: GET
        GetApplicationResourceDetail:
          Type: HttpApi
          Properties:
            # Greedy {resource_id+}, same ARN-with-"/" reasoning as
            # GetResourceDetail above.
            Path: /applications/{id}/resources/{resource_id+}
            Method: GET
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadOwnStatusTable
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource: !GetAtt PipelineStatusTable.Arn

  # ---- Dashboard hosting: S3 (private) + CloudFront (public, HTTPS, custom domain) ----
  # The dashboard is plain static HTML/JS/CSS, hash-routed (#/pipeline-monitor/...) -
  # every real HTTP request is for an actual file (/, /app.js, /views/x.js, ...),
  # so no SPA-fallback/rewrite rule is needed here, unlike a path-based router.

  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: pipeline-freshness-monitor-dashboard
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pipeline-freshness-monitor-dashboard-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution.Id}"

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: pipeline-freshness-monitor dashboard
        DefaultRootObject: index.html
        Aliases:
          - datapipeline.athivaone.com
        ViewerCertificate:
          AcmCertificateArn: !Ref DashboardCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: DashboardS3Origin
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: DashboardS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # AWS managed "CachingOptimized" policy - no custom cache config needed.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  DashboardDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z0188898X51DLEN9N60F # existing athivaone.com zone
      Name: datapipeline.athivaone.com
      Type: A
      AliasTarget:
        DNSName: !GetAtt DashboardDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed global hosted zone ID (same for every distribution)
        EvaluateTargetHealth: false

Outputs:
  StatusTableName:
    Value: !Ref PipelineStatusTable
  DashboardApiUrl:
    Description: Base URL for the read-only status API (append /status)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  MonitorFunctionName:
    Value: !Ref MonitorFunction
  DashboardBucketName:
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Value: !Ref DashboardDistribution
  DashboardUrl:
    Value: "https://datapipeline.athivaone.com"
