# This file is entirely OPTIONAL. AWS Step Functions itself is the single
# source of truth for which pipelines exist and appear on the dashboard -
# every state machine in the account is discovered and monitored
# automatically (see handler.py's unified discovery loop), with no
# dependency on this file. It is empty by default and the application
# works fully without it.
#
# What this file is for: a per-ARN metadata OVERRIDE, only needed when
# automatic detection genuinely can't do the job -
#
#   - A trusted schedule (`schedule:` + `grace_period_minutes:`) - without
#     one, execution health for that pipeline reports "Unknown" rather than
#     Fresh/Delayed/Stale, because trigger_scanner.py can only *detect* that
#     a schedule exists (shown as "Detected Trigger" on the pipeline's page),
#     not verify it's trustworthy enough to compute freshness from.
#   - An exact output location (`output:`) - without one, data freshness
#     reports a clear "no supported output source was identified" /
#     "output source detected, but the exact location could not be
#     determined automatically" instead of a real S3 check, because nothing
#     in this codebase resolves a dynamic/templated resource reference found
#     in a state machine definition into one checkable bucket+key.
#   - `alerting_enabled: true` - every auto-discovered pipeline defaults to
#     alerting off; there is no AWS-only signal for "this should page
#     someone," so opting a pipeline into alerting is only possible here.
#   - `owner:` / `contact:` - human-curated facts AWS has no record of.
#   - Excluding a state machine from the dashboard entirely (see `excluded:`
#     below) - e.g. an AWS-managed internal automation stack that isn't a
#     business pipeline at all.
#
# Nothing here is required for a pipeline to be discovered, monitored, or
# shown - only to unlock the specific capabilities above for one pipeline.
#
# excluded: (optional, top-level, sibling of `pipelines:` below) - a plain
# list of state machine names to skip entirely during discovery (no AWS
# calls, no DynamoDB item written/updated for them). Empty/absent by default.
# Example:
# excluded:
#   - some-internal-test-stub

pipelines: []
