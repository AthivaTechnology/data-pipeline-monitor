<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Athivatech | Data Reliability Platform</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="navbar">
  <a class="brand" href="#/" aria-label="Athivatech Data Reliability Platform, go to Home">
    <svg class="brand-logo" width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="navLogoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#6366f1"/>
          <stop offset="0.55" stop-color="#8b5cf6"/>
          <stop offset="1" stop-color="#14b8a6"/>
        </linearGradient>
      </defs>
      <rect width="40" height="40" rx="10" fill="url(#navLogoGrad)"/>
      <path d="M12 24a5 5 0 0 1 1-9.9 6 6 0 0 1 11.4-2A5.5 5.5 0 0 1 27 24H12z" fill="#fff" fill-opacity="0.95"/>
      <circle cx="14.5" cy="28.5" r="1.3" fill="#fff" fill-opacity="0.85"/>
      <circle cx="20" cy="29.5" r="1.3" fill="#fff" fill-opacity="0.85"/>
      <circle cx="25.5" cy="28.5" r="1.3" fill="#fff" fill-opacity="0.85"/>
    </svg>
    <span class="brand-text">
      <span class="brand-name">Athivatech</span>
      <span class="brand-sub">Data Reliability Platform</span>
    </span>
  </a>
  <nav>
    <a class="nav-link" data-nav="home" href="#/">Home</a>
    <a class="nav-link" data-nav="pipeline-monitor" href="#/pipeline-monitor">Pipeline Monitor</a>
    <a class="nav-link" data-nav="lineage" href="#/lineage">Lineage &amp; Catalog</a>
    <a class="nav-link" data-nav="settings" href="#/settings/monitoring">Settings</a>
  </nav>
  <span class="spacer"></span>
  <div class="navbar-utility">
    <span class="region-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      US-EAST-1
    </span>
    <span class="admin-chip">
      <span class="admin-avatar">A</span>
      Admin
    </span>
  </div>
</div>

<div id="app" class="page"></div>

<!-- Classic scripts on purpose (no type="module") - this file is opened
     directly via file://, and module imports are blocked under file://.
     Load order matters: app.js defines Utils/Api/Views/router before the
     view files below register themselves onto Views. -->
<script src="app.js"></script>
<script src="views/home.js"></script>
<script src="views/pipelineMonitor.js"></script>
<script src="views/pipelineDetail.js"></script>
<script src="views/lineage.js"></script>
<script src="views/catalog.js"></script>
<script src="views/resourceDetail.js"></script>
<script src="views/settingsMonitoring.js"></script>
<script>router();</script>
</body>
</html>
